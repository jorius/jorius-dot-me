name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh the repository snapshot once a day so new repositories show up without a commit.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # react-scripts 4 builds on webpack 4, which needs Node 16 or older.
      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      # The browser used to call the GitHub API on every visit and hit the 60-per-hour
      # unauthenticated limit. The list is fetched here with the workflow token instead
      # and shipped as a static file; nothing secret reaches the bundle.
      - name: Snapshot the public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'users/jorius/repos?per_page=100&sort=updated' \
            --jq '[.[] | select(.fork | not) | select(.archived | not) | {id, name, description, html_url, default_branch, language}]' \
            > public/repos.json
          node -e "const r=require('./public/repos.json'); if(!Array.isArray(r)||r.length<5) process.exit(1); console.log(r.length,'repositories')"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          CI: 'false'
          PUBLIC_URL: /jorius-dot-me/

      # The app uses BrowserRouter; Pages serves 404.html for unknown paths, so a copy of the shell keeps deep links working.
      - name: Add the SPA fallback
        run: cp build/index.html build/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
